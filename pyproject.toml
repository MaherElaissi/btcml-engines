[project]
name = "btcml"
version = "0.1.0"
description = "Multi-timeframe BTC/USDT candle prediction engines"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "polars>=1.0",
    "pyarrow>=16",
    "duckdb>=1.0",
    "feedparser>=6.0",
    "tzdata>=2024.1", # Windows has no system tz database; polars needs it for UTC datetimes
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
btcml = "btcml.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/btcml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
